<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caseificio Vicedomini</title>
    <!-- Google Fonts Inter for ultra-crisp small text readability -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Modern High-Density Light Palette */
        :root {
            --bg-clean: #ffffff;        /* Pure white paper canvas */
            --bg-neutral: #f8fafc;     /* Soft ash grey for structural blocks */
            --text-dark: #0f172a;      /* Deep slate for razor-sharp characters */
            --text-muted: #64748b;     /* Slate grey for secondary indicators */
            --ocean-blue: #0284c7;     /* High-contrast crisp blue for primary headers/links */
            --border-hairline: #e2e8f0;/* Tight, clean border separation lines */
            --action-green: #10b981;   /* Confirmed status color */
            --danger-red: #ef4444;     /* Operational hazard/cancel button color */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-neutral) !important;
            color: var(--text-dark) !important;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif !important;
            font-size: 11px !important; /* Scaled down characters for maximal data footprint */
            line-height: 1.3;
            padding: 8px 12px;
        }

        a {
            color: var(--ocean-blue);
            text-decoration: none;
            font-weight: 500;
        }

        h1, h2, h3, h4 {
            color: var(--text-dark);
            font-weight: 600;
            margin-bottom: 6px;
        }

        h1 { font-size: 14px; border-bottom: 1px solid var(--border-hairline); padding-bottom: 4px; margin-bottom: 10px; }
        h2 { font-size: 12px; color: var(--ocean-blue); text-transform: uppercase; letter-spacing: 0.3px; }
        h3 { font-size: 11px; margin-top: 4px; }

        /* Compact Header Navbar */
        header {
            background: var(--bg-clean);
            border: 1px solid var(--border-hairline);
            border-radius: 4px;
            padding: 4px 10px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }

        .brand-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-dark);
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 8px;
        }

        nav ul li a {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            padding: 2px 4px;
            border-radius: 3px;
        }
        
        nav ul li a:hover {
            background: var(--bg-neutral);
        }

        /* 🌟 ASYMMETRICAL SPLIT-SCREEN ENGINE FOR THE ORDER VIEW */
        /* Targets pages with h3 or blocks running product selections alongside order lists */
        main {
            max-width: 100%;
            margin: 0 auto;
        }

        /* Auto-activates side-by-side splitting if there are consecutive operational blocks */
        main:has(h3:contains("Nuovo Ordine")) {
            display: grid;
            grid-template-columns: 35% 65%; /* 35% Left Side for selection, 65% Right Side for orders */
            gap: 12px;
            align-items: start;
        }

        /* Forces full width title blocks inside the grid structure */
        main:has(h3:contains("Nuovo Ordine")) > h3:first-of-type,
        main:has(h3:contains("Nuovo Ordine")) > div:first-of-type:not(form) {
            grid-column: span 2;
        }

        /* Keeps standard styling intact for other application views */
        .card, div[style*="border"], blockquote, fieldset, form {
            background: var(--bg-clean) !important;
            border: 1px solid var(--border-hairline) !important;
            border-radius: 4px !important;
            padding: 6px 8px !important;
            margin-bottom: 6px !important;
        }

        /* High-Density Tables configuration */
        table, .table {
            width: 100% !important;
            border-collapse: collapse !important;
            margin: 4px 0 !important;
            background: var(--bg-clean) !important;
        }

        table th, table td {
            padding: 3px 6px !important; /* Extremely compressed row height padding */
            border-bottom: 1px solid var(--border-hairline) !important;
            text-align: left;
            font-size: 11px !important;
        }

        table th {
            background-color: var(--bg-neutral) !important;
            color: var(--text-muted) !important;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 9px !important;
            letter-spacing: 0.3px;
        }

        table tr:hover td {
            background: #f1f5f9 !important; /* Highlighting for row scanning */
        }

        /* Smaller input fields and action execution buttons */
        input, select, textarea {
            background-color: var(--bg-clean) !important;
            border: 1px solid var(--border-hairline) !important;
            color: var(--text-dark) !important;
            font-family: inherit !important;
            font-size: 10px !important;
            padding: 2px 4px !important;
            border-radius: 3px !important;
            margin-bottom: 4px !important;
        }

        input:focus, select:focus {
            border-color: var(--ocean-blue) !important;
            outline: none;
        }

        button, .btn {
            font-family: inherit !important;
            font-size: 10px !important;
            font-weight: 600 !important;
            padding: 2px 6px !important;
            border-radius: 3px !important;
            cursor: pointer;
            border: 1px solid var(--border-hairline) !important;
            background: var(--bg-neutral);
            color: var(--text-dark);
            margin: 1px;
        }

        button:hover, .btn:hover {
            background: #e2e8f0;
        }

        /* Operational Colors for Instant Context Mapping */
        .status-badge {
            font-size: 9px;
            padding: 1px 4px;
            border-radius: 2px;
            font-weight: 600;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-title">
            🧀 Caseificio Vicedomini
        </div>
        <nav>
            <ul>
                <li><a href="/?view=client">🛒 Vista Cliente</a></li>
                <li><a href="/?view=admin">🏭 Vista Admin</a></li>
            </ul>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

</body>
</html>
