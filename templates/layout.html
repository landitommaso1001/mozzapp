<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <!-- Fixed Viewport Scaling rules -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    
    <!-- iOS Native App configuration tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MozzApp">
    <link rel="apple-touch-icon" href="/static/icon-192.png">

    <title>Caseificio Vicedomini</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=39">

</head>
<body>

    <header>
      <div class="brand-title" style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
        <a href="{{ url_for('client_bp.index') }}">🧀 Caseificio Vicedomini</a>
        
        <!-- 🌟 DYNAMIC CONTEXT BADGES FOR PC & SMARTPHONE -->
        {% if view == 'admin' %}
            <span class="role-indicator badge-admin">🏭 VISTA ADMIN</span>
        {% else %}
            <span class="role-indicator badge-cliente">🛒 VISTA CLIENTE</span>
        {% endif %}
      </div>
      <nav>
        <ul>
            <li><a href="{{ url_for('client_bp.index') }}">🛒 Vista Cliente</a></li>
            {% if session.get('user_role') == 'admin' or is_admin %}
                <li><a href="{{ url_for('admin.index') }}">🏭 Vista Admin</a></li>
            {% endif %}
        </ul>
      </nav>
  </header>


    <main>
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

</body>
</html>
