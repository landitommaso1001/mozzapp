<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <!-- Fixed Viewport Scaling rules -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    
    <!-- iOS Native App configuration tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MozzApp">
    <link rel="apple-touch-icon" href="/static/icon-192.png">

    <title>Caseificio Vicedomini</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=10">

</head>
<body>

    <header>
        <div class="brand-title">
            <a href="{{ url_for('client_bp.index') }}">🧀 Caseificio Vicedomini</a>
        </div>
        <nav>
            <ul>
                <li><a href="{{ url_for('client_bp.index') }}">🛒 Vista Cliente</a></li>
                {% if session.get('user_role') == 'admin' or is_admin %}
                    <li><a href="{{ url_for('admin.index') }}">🏭 Vista Admin</a></li>
                {% endif %}
            </ul>
        </nav>
    </header>

    <main>
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

</body>
</html>
