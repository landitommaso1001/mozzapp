<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Caseificio Vicedomini</title>
    <!-- Crisp Google Font Inter -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<head>
   
    <!-- 🍏 iOS Native Mobile App Wrapper Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MozzApp">
    
    <!-- App Icon for iPhone Home Screen -->
    <link rel="apple-touch-icon" href="/static/icon-192.png">
</head>


</head>
<body>
<header>
    <div class="brand-title">🧀 Caseificio Vicedomini</div>
    <nav>
        <ul>
            <!-- Cleans up route redirections back to native blueprint frameworks -->
            <li><a href="/?view=client">🛒 Vista Cliente</a></li>
            {% if session.get('user_role') == 'admin' or is_admin %}
            <li><a href="/admin/?active_tab=orders">🏭 Vista Admin</a></li>
            {% endif %}
        </ul>
    </nav>
</header>

    <main>
        {% block content %}{% endblock %}
    </main>
</body>


</html>
