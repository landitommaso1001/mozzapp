<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caseificio Vicedomini</title>
    <!-- Google Fonts Inter for ultra-crisp small text readability -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-deep: #0f172a;        /* Deep midnight ocean foundation */
            --card-deep: #1e293b;      /* Crisp sub-surface card blocks */
            --text-bright: #f8fafc;    /* Highly readable primary values */
            --text-muted: #94a3b8;     /* Muted subtext & metrics labels */
            --ocean-blue: #38bdf8;     /* Vibrant electric blue for focus/links */
            --border-subtle: #334155;  /* Clean hairline component dividers */
            --action-green: #4ade80;   /* Confirmation text and success actions */
            --danger-red: #f87171;     /* Delete / warning system accents */
        }

        /* 1. Global Scale-Down and Density Setup */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-deep) !important;
            color: var(--text-bright) !important;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif !important;
            font-size: 12px !important; /* Scaled down characters to fit maximum items */
            line-height: 1.4;
            padding: 8px 12px;
        }

        a {
            color: var(--ocean-blue);
            text-decoration: none;
            font-weight: 500;
        }
        
        a:hover {
            text-decoration: underline;
        }

        h1, h2, h3, h4 {
            color: var(--text-bright);
            font-weight: 600;
            margin-bottom: 8px;
        }

        h1 { font-size: 16px; border-bottom: 1px solid var(--border-subtle); padding-bottom: 6px; }
        h2 { font-size: 14px; margin-top: 10px; color: var(--ocean-blue); }
        h3 { font-size: 13px; margin-top: 8px; }
        h4 { font-size: 12px; color: var(--text-muted); }

        /* 2. Compact Navigation Header Layout */
        header {
            background: var(--card-deep);
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
            padding: 6px 12px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-bright);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 12px;
        }

        nav ul li a {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 2px 6px;
            border-radius: 4px;
        }
        
        nav ul li a:hover {
            background: var(--border-subtle);
        }

        /* 3. Global Framework Container Overrides */
        main {
            max-width: 100%;
            margin: 0 auto;
        }

        /* High-density grid-cards for loop data (Orders, Products lists) */
        .card, div[style*="border"], blockquote, fieldset {
            background: var(--card-deep) !important;
            border: 1px solid var(--border-subtle) !important;
            border-radius: 6px !important;
            padding: 6px 10px !important; /* Compressed padding spacing */
            margin-bottom: 6px !important;
            color: var(--text-bright) !important;
        }

        /* 4. Ultra-Compact High-Density Matrix Tables */
        table, .table {
            width: 100% !important;
            border-collapse: collapse !important;
            margin: 8px 0 !important;
            background: var(--card-deep) !important;
            border-radius: 6px;
            overflow: hidden;
        }

        table th, table td {
            padding: 4px 8px !important; /* Extremely tight compression vertical space */
            border-bottom: 1px solid var(--border-subtle) !important;
            text-align: left;
            font-size: 11px !important;
            color: var(--text-bright) !important;
        }

        table th {
            background-color: rgba(51, 65, 85, 0.5) !important;
            color: var(--ocean-blue) !important;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 10px !important;
            letter-spacing: 0.5px;
        }

        table tr:last-child td {
            border-bottom: none !important;
        }

        table tr:hover td {
            background: rgba(56, 189, 248, 0.05) !important; /* Soft active row hover tracking */
        }

        /* 5. Compressed Forms, Input Fields, and Operational Action Buttons */
        input, select, textarea {
            background-color: var(--bg-deep) !important;
            border: 1px solid var(--border-subtle) !important;
            color: var(--text-bright) !important;
            font-family: inherit !important;
            font-size: 11px !important;
            padding: 3px 6px !important; /* Tight internal sizing */
            border-radius: 4px !important;
            margin: 2px 0 6px 0 !important;
            display: inline-block;
        }

        input:focus, select:focus {
            border-color: var(--ocean-blue) !important;
            outline: none;
        }

        button, .btn {
            font-family: inherit !important;
            font-size: 11px !important;
            font-weight: 600 !important;
            padding: 3px 8px !important;
            border-radius: 4px !important;
            cursor: pointer;
            border: none !important;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin: 2px;
            transition: opacity 0.1s ease;
        }

        button:hover, .btn:hover {
            opacity: 0.9;
        }

        /* Semantic Colors for Buttons and Status Text */
        button[type="submit"], button:contains("Salva"), button:contains("Approva"), button[style*="green"] {
            background-color: var(--action-green) !important;
            color: #042f1a !important;
        }

        button:contains("Annulla"), button:contains("Rimuovi"), button:contains("Resetta") {
            background-color: var(--danger-red) !important;
            color: #4c0505 !important;
        }

        /* Utility helper classes for layout alignments */
        hr {
            border: 0;
            border-top: 1px solid var(--border-subtle);
            margin: 8px 0;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-title">
            <span>🧀</span> Caseificio Vicedomini
        </div>
        <nav>
            <ul>
                <li><a href="/?view=client">🛒 Vista Cliente</a></li>
                <li><a href="/?view=admin">🏭 Vista Admin</a></li>
            </ul>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

</body>
</html>
