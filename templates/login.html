{% extends 'layout.html' %}
{% block content %}
<div style="max-width: 400px; margin: 60px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
    <h2 style="color: #2c3e50; text-align: center; margin-bottom: 25px;">🔐 Accedi al Portale</h2>
    <form method="POST" action="{{ url_for('client_bp.login') }}">
        <div style="margin-bottom: 15px;">
            <label style="display:block; font-weight:bold; margin-bottom:5px;">Numero di Telefono:</label>
            <input type="text" name="phone" required style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:6px; box-sizing:border-box;">
        </div>
        <div style="margin-bottom: 20px;">
            <label style="display:block; font-weight:bold; margin-bottom:5px;">Password:</label>
            <input type="password" name="password" required style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:6px; box-sizing:border-box;">
        </div>
        <button type="submit" style="background:#b5835a; color:white; border:none; padding:12px; width:100%; font-weight:bold; border-radius:6px; cursor:pointer;">Entra</button>
    </form>
    <p style="text-align:center; margin-top:20px; font-size:0.9rem;">Non hai un account? <a href="{{ url_for('client_bp.register') }}" style="color:#b5835a; font-weight:bold;">Registrati qui</a></p>
</div>
{% endblock %}
